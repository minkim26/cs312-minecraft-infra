# kube-prometheus-stack Helm values for single-node k3s lab (t3.medium, 4 GB RAM)
#
# Cost / resource rationale:
#   Minecraft JVM uses up to 2.5 Gi (MEMORY=2G heap); monitoring stack ~1.1 Gi total.
#   Scrape interval is 30s (default is 15s); halving it reduces Prometheus RAM ~15%.
#   Prometheus retention: 10 days / 2 GB — auto-prunes so disk growth is bounded.
#   Grafana has no PVC; dashboards load from ConfigMap so nothing is lost on restart.
#
# Tear-down:
#   helm uninstall kube-prom -n monitoring
#   kubectl delete ns monitoring

defaultRules:
  create: true
  rules:
    etcd: false
    kubeProxy: false
    kubeScheduler: false

prometheus:
  prometheusSpec:
    scrapeInterval: "30s"
    evaluationInterval: "30s"
    retention: "10d"
    retentionSize: "2GB"
    # Pick up ServiceMonitors and PrometheusRules from any namespace (needed for
    # the minecraft namespace resources defined in ops5/k8s/).
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
    serviceMonitorSelector: {}
    podMonitorSelector: {}
    ruleSelector: {}
    resources:
      requests:
        memory: "256Mi"
        cpu: "100m"
      limits:
        memory: "512Mi"
        cpu: "500m"
    storageSpec:
      volumeClaimTemplate:
        spec:
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: "3Gi"

alertmanager:
  alertmanagerSpec:
    resources:
      requests:
        memory: "32Mi"
        cpu: "25m"
      limits:
        memory: "128Mi"
        cpu: "100m"
  config:
    global:
      resolve_timeout: "5m"
    route:
      group_by: ["alertname", "namespace"]
      group_wait: "30s"
      group_interval: "5m"
      repeat_interval: "12h"
      receiver: "null"
    receivers:
      - name: "null"

grafana:
  adminPassword: "admin"
  service:
    type: NodePort
    nodePort: 30300
  resources:
    requests:
      memory: "128Mi"
      cpu: "50m"
    limits:
      memory: "512Mi"
      cpu: "200m"
  # No PVC — dashboards are loaded from ConfigMap; loss of Grafana pod loses only
  # manually created dashboards (none expected in this setup).
  persistence:
    enabled: false
  sidecar:
    dashboards:
      enabled: true
      label: grafana_dashboard
      labelValue: "1"
      searchNamespace: ALL

kubeStateMetrics:
  enabled: true

kube-state-metrics:
  resources:
    requests:
      memory: "64Mi"
      cpu: "10m"
    limits:
      memory: "128Mi"
      cpu: "100m"

nodeExporter:
  enabled: true

prometheus-node-exporter:
  resources:
    requests:
      memory: "16Mi"
      cpu: "10m"
    limits:
      memory: "64Mi"
      cpu: "50m"

prometheusOperator:
  resources:
    requests:
      memory: "64Mi"
      cpu: "50m"
    limits:
      memory: "256Mi"
      cpu: "200m"
